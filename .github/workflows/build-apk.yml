name: Build and Publish Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-debug-apk:
    name: Build & Release Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Temurin JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          java -version
          echo "JAVA_HOME: $JAVA_HOME"
          RAW_VERSION=$(java -version 2>&1 | awk -F '"' '/version/ {print $2}')
          echo "Raw Java Version: $RAW_VERSION"
          if [ -z "$RAW_VERSION" ]; then
            echo "Error: Could not detect Java version."
            exit 1
          fi
          MAJOR_VERSION=$(echo "$RAW_VERSION" | awk -F. '{if ($1 == "1") print $2; else print $1}')
          echo "Detected Java Major Version: $MAJOR_VERSION"
          if ! [[ "$MAJOR_VERSION" =~ ^[0-9]+$ ]]; then
            echo "Error: Could not parse Java major version as an integer."
            exit 1
          fi
          if [ "$MAJOR_VERSION" -lt 17 ]; then
            echo "Error: Java major version is $MAJOR_VERSION, which is lower than required version 17."
            exit 1
          fi
          echo "Java environment verified successfully: Version $MAJOR_VERSION (>= 17)."

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          if [ -f "./debug.keystore" ]; then
            echo "debug.keystore already exists."
          else
            echo "debug.keystore does not exist. Generating temporary debug keystore..."
            keytool -genkeypair \
              -v \
              -keystore ./debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
            if [ ! -f "./debug.keystore" ]; then
              echo "Error: Failed to create ./debug.keystore"
              exit 1
            fi
            echo "Temporary debug keystore created successfully."
          fi

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify debug APK
        run: |
          TARGET_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$TARGET_APK" ]; then
            echo "Error: Expected debug APK $TARGET_APK does not exist."
            echo "Searching only inside app/build/outputs/apk for any APKs found:"
            if [ -d "app/build/outputs/apk" ]; then
              find app/build/outputs/apk -maxdepth 4 -name "*.apk"
            else
              echo "Directory app/build/outputs/apk does not exist."
            fi
            echo "Failing step because expected debug APK was not found."
            exit 1
          fi

          if [ ! -f "$TARGET_APK" ]; then
            echo "Error: $TARGET_APK is not a regular file."
            exit 1
          fi

          if [ ! -s "$TARGET_APK" ]; then
            echo "Error: $TARGET_APK is empty."
            exit 1
          fi

          case "$TARGET_APK" in
            *.apk) ;;
            *)
              echo "Error: $TARGET_APK does not have the .apk extension."
              exit 1
              ;;
          esac

          if [ "$TARGET_APK" != "app/build/outputs/apk/debug/app-debug.apk" ]; then
            echo "Error: Selected APK is not exactly app/build/outputs/apk/debug/app-debug.apk"
            exit 1
          fi

          echo "APK successfully verified at: $TARGET_APK"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          REPO_NAME="${GITHUB_REPOSITORY##*/}"
          SAFE_REPO_NAME=$(echo "$REPO_NAME" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9_-]/-/g' | sed 's/--*/-/g' | sed 's/^-//;s/-$//')
          if [ -z "$SAFE_REPO_NAME" ]; then
            SAFE_REPO_NAME="android-app"
          fi
          RELEASE_FILENAME="${SAFE_REPO_NAME}-debug-build-${GITHUB_RUN_NUMBER}.apk"
          TEMP_DIR="${RUNNER_TEMP:-/tmp}/apk-release-asset-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -p "$TEMP_DIR"
          RELEASE_APK_PATH="${TEMP_DIR}/${RELEASE_FILENAME}"
          cp "app/build/outputs/apk/debug/app-debug.apk" "$RELEASE_APK_PATH"

          if [ ! -f "$RELEASE_APK_PATH" ] || [ ! -s "$RELEASE_APK_PATH" ]; then
            echo "Error: Failed to prepare release asset at $RELEASE_APK_PATH"
            exit 1
          fi

          echo "Prepared release asset: $RELEASE_APK_PATH"
          echo "asset_path=$RELEASE_APK_PATH" >> "$GITHUB_OUTPUT"
          echo "asset_name=$RELEASE_FILENAME" >> "$GITHUB_OUTPUT"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh --version
          ASSET_PATH="${{ steps.prepare_asset.outputs.asset_path }}"
          ASSET_NAME="${{ steps.prepare_asset.outputs.asset_name }}"

          if [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ]; then
            echo "Error: Release asset $ASSET_PATH does not exist or is empty."
            exit 1
          fi

          case "$ASSET_PATH" in
            *.apk) ;;
            *)
              echo "Error: Asset $ASSET_PATH does not have the .apk extension."
              exit 1
              ;;
          esac

          TAG_NAME="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          RELEASE_TITLE="Debug APK Build #${GITHUB_RUN_NUMBER}"

          NOTES=$(cat <<EOF
          ### Debug APK Build Details

          - **Build Type**: Automatically generated debug APK
          - **Builder**: GitHub Actions
          - **Run Number**: ${GITHUB_RUN_NUMBER}
          - **Run Attempt**: ${GITHUB_RUN_ATTEMPT}
          - **Commit SHA**: ${GITHUB_SHA}
          - **Purpose**: Intended for testing and development preview
          - **Notice**: This APK is NOT a Play Store production release
          - **Signing**: Signed only with a temporary debug keystore

          Download the APK directly from the **Assets** section below: \`${ASSET_NAME}\`.
          EOF
          )

          gh release create "$TAG_NAME" "$ASSET_PATH" \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_TITLE" \
            --notes "$NOTES" \
            --latest

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG_NAME="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          RELEASE_TITLE="Debug APK Build #${GITHUB_RUN_NUMBER}"
          ASSET_NAME="${{ steps.prepare_asset.outputs.asset_name }}"

          if [ "${{ steps.publish_release.outcome }}" = "success" ]; then
            echo "=================================================="
            echo "GitHub Release published successfully!"
            echo "Release Tag: $TAG_NAME"
            echo "Release Title: $RELEASE_TITLE"
            RELEASE_URL=$(gh release view "$TAG_NAME" --json url -q .url 2>/dev/null || echo "https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG_NAME}")
            echo "Release URL: $RELEASE_URL"
            echo "APK Asset Name: $ASSET_NAME"
            echo "The APK can be downloaded directly from the release Assets section."
            echo "Backup Actions artifact 'app-debug-apk' is also available."
            echo "=================================================="

            echo "### 🚀 Debug APK Release Published" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Release Tag**: \`$TAG_NAME\`" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Release Title**: $RELEASE_TITLE" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Direct Download**: [View Release and Download APK]($RELEASE_URL)" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Asset Filename**: \`$ASSET_NAME\` (available under the release Assets section)" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Actions Artifact**: \`app-debug-apk\` is also available as a backup under the workflow summary." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning ::GitHub Release publishing did not succeed. However, the APK build and Actions artifact upload succeeded."
            echo "The debug APK artifact named 'app-debug-apk' is available for download directly under the Actions summary."

            echo "### ⚠️ Debug APK Build Succeeded (Release Publishing Warning)" >> "$GITHUB_STEP_SUMMARY"
            echo "- **APK Build**: Succeeded" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Actions Artifact**: Succeeded. The debug APK is safely preserved as the Actions artifact **\`app-debug-apk\`**." >> "$GITHUB_STEP_SUMMARY"
            echo "- **Release Publishing**: GitHub Release creation did not complete. You can download the APK from the workflow artifacts above." >> "$GITHUB_STEP_SUMMARY"
          fi
